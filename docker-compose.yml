# Caesar Cafe — one compose file, local and production.
#
#   local:        docker compose up -d --build
#   local + HMR:  docker compose --profile dev up -d --build
#   production:   Dokploy clones the repo and runs this file. Nothing else.
#
# There used to be three files (dev, prod, dokploy) and they drifted, which is the
# usual fate of parallel copies: a header tightened in one, a flag added to
# another, and the thing you tested is not the thing you deployed. There is one
# file now, and **the difference between local and production is `.env`, not YAML.**
#
# `DJANGO_ENV` is the single switch. It selects the build stage (the Dockerfile's
# stages are literally named `dev` and `prod`), the settings module, and the server
# the api runs. One variable rather than three that must agree.
#
# What is deliberately NOT different between the two modes:
#
#   * **Postgres and Redis publish no ports, ever.** They sit on an internal
#     network the host cannot reach, in both modes. A stack that works locally
#     only because a port is exposed will fail in production, and it will fail
#     after you have stopped looking for that class of bug.
#   * **Everything is reached through Caddy**, so `/api/*` is same-origin in both
#     modes. That is what makes `connect-src 'self'` in the CSP a real constraint
#     rather than a comment.
#   * The security headers, the resource limits, the log rotation, the statement
#     timeouts and the unprivileged user apply in both. A local stack that is
#     shaped differently from production is not a rehearsal.

name: caesar

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Shared by api, worker and beat — three processes, one image, one config.
x-django: &django
  build:
    context: ./backend
    # The Dockerfile's stages are named `dev` and `prod`, so this needs no second
    # variable. `dev` installs the dev extras and runs as root; `prod` installs
    # without them and drops to an unprivileged user.
    target: ${DJANGO_ENV:-prod}
  # The mode is IN the tag. Both stages produce a `caesar-api` image, and with one
  # shared tag whichever built last would win: switch DJANGO_ENV to dev and you get
  # the prod image back — no autoreload, and no pytest, reported as
  # "No module named pytest" from a file that plainly has it installed. Two tags,
  # so the two images cannot be mistaken for each other.
  image: caesar-api:${DJANGO_ENV:-prod}-${IMAGE_TAG:-latest}
  env_file: [.env]
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.${DJANGO_ENV:-prod}
    # Passed explicitly as well as through env_file, so the start script below can
    # branch on it even when .env does not mention it.
    DJANGO_ENV: ${DJANGO_ENV:-prod}
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  # ── data ───────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caesar}
      POSTGRES_USER: ${POSTGRES_USER:-caesar}
      # No default. A database whose password is whatever the file happened to say
      # is a database with a known password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — see .env.example}
    # A statement timeout, so one pathological query cannot hold a connection all
    # night. 30s is far above any request this app makes and far below "forever".
    command:
      - postgres
      - -c
      - statement_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=60000
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caesar} -d ${POSTGRES_DB:-caesar}"]
      interval: 10s
      timeout: 5s
      # Same reasoning as redis below. Postgres replays its WAL after an unclean
      # shutdown, and the api waits on this too — so a slow recovery must not be
      # mistaken for a broken database.
      start_period: 60s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    # **No `--appendonly yes`.** RDB snapshots instead, and this is a fix, not a
    # downgrade.
    #
    # The append-only file took the whole site down, repeatedly:
    #
    #     # Bad file format reading the append only file appendonly.aof.1.incr.aof
    #
    # A torn write from an earlier crash left the incremental AOF unparseable, so
    # redis read it, refused to start, exited, and was restarted — every 60
    # seconds, forever. `api` waits on redis, so it never started, so every
    # `/api/*` answered 502 with `connection refused`. Three sessions of debugging
    # went to Caddy, to ports, to the domain and to the seed, all of them
    # downstream of this file.
    #
    # AOF appends to a live file, so a crash mid-append leaves a half-written
    # command that redis cannot skip. **RDB writes a temp file and renames it**,
    # which is atomic — a crash during a save leaves the previous good snapshot
    # untouched. The failure mode that just cost three deploys becomes impossible.
    #
    # What that costs: tasks queued since the last snapshot, and a cache. Nothing
    # here is a source of truth — orders, payments and stock are in Postgres, and
    # a lost rollup or notification task is recomputed on the next tick. Durability
    # that can refuse to start is not durability.
    #
    # Verified against the real thing: a deliberately corrupted AOF crash-loops
    # under the old command and answers PONG under this one, **on the same volume**
    # — so a server already holding a broken file recovers on the next deploy with
    # nothing to delete by hand.
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    # `start_period` because a container that is still starting is not a container
    # that is broken, and Docker needs telling: failures inside the start period do
    # not count toward retries. Loading a snapshot is fast, but the api waits on
    # this check, so the cost of being wrong is the whole site.
    #
    # It was the absence of this that first turned the AOF problem above into
    # `dependency failed to start: redis is unhealthy` — the real cause was the
    # corrupt file, but with ~50s of grace a merely SLOW redis would have failed
    # the same way and sent the next person hunting in the same wrong places.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    logging: *logging
    networks: [internal]

  # ── application ────────────────────────────────────────────────────────────
  api:
    <<: *django
    # Migrations, roles and static files on every start.
    #
    # `sync_roles` is here rather than in a runbook because a release that adds a
    # permission code otherwise lands with the code in the catalogue, the routes
    # enforcing it, and no role holding it — the feature is deployed and nobody
    # can reach it. Ask how many times that shipped before it was noticed.
    #
    # `$$` escapes the interpolation so compose passes the variable through to the
    # shell instead of substituting it at parse time.
    command:
      - sh
      - -c
      - |
        set -e

        # A marker before every step.
        #
        # Three rounds of this deploy went on guessing which step the boot died
        # on, because a container that stops mid-sequence leaves logs that end
        # without saying what they were doing. `set -e` exits silently: the last
        # line you see is the last thing that WORKED, not the thing that broke,
        # and the distance between those two is a whole debugging session.
        echo "[boot] 1/5 migrate"
        python manage.py migrate --noinput

        echo "[boot] 2/5 sync_roles"
        python manage.py sync_roles

        # ── the demo, in the BACKGROUND ────────────────────────────────────
        #
        # This used to run before gunicorn, and that was the bug behind:
        #
        #     dial tcp 10.0.1.36:8000: connect: connection refused   → 502
        #
        # The container was up and the port was closed, because the boot was still
        # generating a fortnight of trading — thousands of orders through the real
        # order and payment services. On a laptop that is two minutes. On a small
        # VPS it is longer, and if the container is restarted or OOM-killed part
        # way, the seed begins again from nothing and the server never starts at
        # all. A slow demo dataset should never be able to mean "no website".
        #
        # The rule this encodes: **only work the server cannot serve without may
        # block the server.** Migrations, roles and static files qualify — a server
        # without them answers wrong. Demo data does not.
        #
        # `demo_admin` stays in the foreground because it takes about a second and
        # a login that is not there yet is a demo nobody can enter.
        echo "[boot] 3/5 demo admin (DEMO_ADMIN=$${DEMO_ADMIN:-0})"
        if [ "$${DEMO_ADMIN:-0}" = "1" ]; then
          python manage.py demo_admin ||             echo "demo_admin failed — the site is up, but the admin login was not created"
        fi

        echo "[boot] 4/5 demo seed, backgrounded (DEMO_SEED=$${DEMO_SEED:-0})"
        if [ "$${DEMO_SEED:-0}" = "1" ]; then
          (
            python manage.py seed_demo --days "$${DEMO_DAYS:-14}"               && echo "seed_demo finished — the demo data is ready"               || echo "seed_demo declined or failed; the site is unaffected"
          ) &
        fi

        if [ "$${DJANGO_ENV:-prod}" = "dev" ]; then
          exec python manage.py runserver 0.0.0.0:8000
        fi

        echo "[boot] 5/5 collectstatic"
        python manage.py collectstatic --noinput

        echo "[boot] starting gunicorn on 0.0.0.0:8000 — the port opens now"
        exec gunicorn config.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers "$${GUNICORN_WORKERS:-2}" \
          --timeout 60 \
          --graceful-timeout 30 \
          --max-requests 1000 \
          --max-requests-jitter 100 \
          --access-logfile - \
          --error-logfile -
    volumes:
      - static:/app/staticfiles
      - media:/app/media
      - backups:/backups
    # **No published host port, deliberately.**
    #
    # Two Dokploy deploys died on this line's neighbour:
    #
    #     failed to bind port 127.0.0.1:8080/tcp: address already in use
    #
    # An empty default was not enough. The env file is pasted into Dokploy's panel
    # and lives on after the file changes, so a stale `API_PORT=8010` there still
    # reaches this file — a variable is a value somebody else can set. The only
    # binding that cannot collide is the one that does not exist.
    #
    # Nothing needs it. Traefik reaches `web` over the proxy network, Caddy reaches
    # `api:8000` over `edge`, and Vite proxies to the same address in development.
    # For a shell on the server, `docker compose exec api ...` needs no port; to
    # browse the production shape locally, `--profile local` publishes one (see
    # `web-local` at the bottom of this file).
    # Overridden for two reasons, and the second one is the interesting one.
    #
    # 1. `--start-period=20s` in the image is right for a restart and far too short
    #    for a FIRST boot: migrations, `collectstatic` and (with DEMO_SEED=1) two
    #    weeks of generated trading all run before gunicorn binds — just over two
    #    minutes here. Docker reports unhealthy meanwhile, and an orchestrator that
    #    gates a deploy on health calls that a failed deploy. The image cannot know
    #    whether seeding is on; this file can.
    #
    # 2. The image's check asks for plain http, so in prod mode it receives the
    #    `SECURE_SSL_REDIRECT` 301 — and `curl -f` does not fail on a 3xx, so it
    #    **passed on the redirect**, having proven only that something was
    #    listening on the port. It never reached the view, so it never checked the
    #    database it exists to check. With the forwarded-proto header it gets the
    #    real 200 and the real database probe.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://localhost:8000/api/v1/system/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 240s
      retries: 3
    networks: [internal, edge]
    deploy:
      resources:
        limits: {memory: 1G}
    develop:
      # `docker compose watch` syncs code into the running container. This replaces
      # the old dev bind mount, which could not live in a shared file: mounting the
      # host's ./backend over /app in production would shadow the image's installed
      # code with whatever the clone happened to contain.
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore: [.venv/, __pycache__/, .pytest_cache/, htmlcov/]
        - action: rebuild
          path: ./backend/pyproject.toml

  worker:
    <<: *django
    command: celery -A config worker -l info --concurrency=${CELERY_CONCURRENCY:-2} --max-tasks-per-child=200
    volumes:
      - media:/app/media
      - backups:/backups
    networks: [internal]
    # The image's own HEALTHCHECK curls :8000, because it was written for the api.
    # A worker serves no HTTP, so that check can never pass and Docker reports this
    # container as permanently unhealthy — which is worse than having no check at
    # all, because it teaches you that "unhealthy" here means nothing, and then you
    # read past it on the day the api says it too.
    #
    # This asks the worker whether it is actually consuming from the broker, which
    # is the thing that matters. 20s because `inspect ping` waits on a round trip.
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 40s
      retries: 3
    deploy:
      resources:
        limits: {memory: 768M}

  beat:
    <<: *django
    command: celery -A config beat -l info
    networks: [internal]
    # Disabled rather than faked, for the same reason as above but the opposite
    # conclusion. beat answers no `inspect` — it publishes, it does not consume —
    # so the only check available is "is the process running", which Docker already
    # knows and which tells you nothing: a beat that has silently stopped
    # scheduling is still a running process. The real signal is a scheduled job
    # that stopped arriving, and that is monitored where the job lands.
    healthcheck:
      disable: true
    deploy:
      resources:
        limits: {memory: 256M}

  # ── the edge ───────────────────────────────────────────────────────────────
  web:
    # Caddy, serving the built SPA and proxying /api/* to the api service. The SPA
    # is built inside the image because Dokploy has no host step to build it on —
    # it clones the repo and brings this file up.
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    image: caesar-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    volumes:
      # Read-only: this container serves these, it never writes them.
      - static:/srv/static:ro
      - media:/srv/media:ro
    # No published port — see the note on `api`. In production Traefik routes to
    # this container over the proxy network; publishing a host port beside that is
    # pure liability, and it is what broke the deploy twice.
    networks: [internal, edge, proxy]
    # **Healthy**, not merely started.
    #
    # This was `depends_on: [api]`, which waits only for the container to exist.
    # So Caddy came up, answered its own /healthz, and Dokploy reported a
    # SUCCESSFUL deploy — while every /api/* request returned 502 because gunicorn
    # was not listening. Hours went into reading Caddy logs that were working
    # perfectly and describing a failure one container over.
    #
    # A deploy that half-works is worse than one that fails: the failure is real
    # either way, but only one of them tells you. With `service_healthy` the api
    # must actually answer /api/v1/system/health/ — database probe and all — before
    # the site is served at all. Dokploy then marks the deploy failed, which is the
    # truth, and the old deployment keeps serving until the new one earns the swap.
    #
    # The api gets 240s of start_period first, so a slow first boot is not mistaken
    # for a broken one.
    depends_on:
      api: {condition: service_healthy}
    deploy:
      resources:
        limits: {memory: 128M}
    # No Traefik labels, on purpose.
    #
    # Dokploy owns the domain: you set it in the app's Domains panel and it writes
    # the router, the entrypoint and the certificate resolver itself. Labels here
    # too would mean TWO routers matching one hostname — and they disagreed, which
    # is worse than either being wrong on its own. The label said port 80 (Caddy);
    # the panel said 8000 (gunicorn), where nothing serves the SPA.
    #
    # **The panel must say port 80.** That is the port this container listens on:
    # Caddy, `:80` in deploy/Caddyfile, `EXPOSE 80` in deploy/Dockerfile.web. 8000
    # is the api, and the api is not the thing the domain should reach — it serves
    # no SPA, no /static and no /media, and in prod mode it answers a redirect to
    # https that the proxy has already terminated.
    #
    # The container still joins the proxy network below; that is what lets Traefik
    # find it at all.

  # ── local only ─────────────────────────────────────────────────────────────
  frontend:
    # Vite with hot reload, for working on the SPA. Off unless you ask for it:
    #   docker compose --profile dev up -d
    # Without it, `web` serves the built bundle and a change needs a rebuild —
    # which is also exactly what production does.
    profiles: [dev]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Relative, so the browser calls this same origin and Vite proxies `/api` to
      # `api:8000` over the compose network (see `server.proxy` in vite.config.ts).
      #
      # It used to be `http://localhost:${API_PORT}/api/v1`, which required the API
      # to be published on a known host port — and a known port is what collided on
      # the Dokploy server. This also matches production, where Caddy serves the SPA
      # and the API from one origin, so a CORS or cookie problem surfaces here
      # instead of after a deploy.
      VITE_API_BASE_URL: /api/v1
      # The HMR client dials this from the page. It must be the HOST port, not
      # Vite's internal 5173, or the websocket connects to nothing and every edit
      # needs a manual refresh.
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
    volumes:
      - ./frontend:/app
      # `npm run api:types` reads ../backend/schema.yml. Read-only: the schema is
      # generated by the backend, never here.
      - ./backend/schema.yml:/backend/schema.yml:ro
      - frontend_modules:/app/node_modules
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    networks: [edge]

  web-local:
    # The production shape, with a host port, for your machine only.
    #
    # `web` publishes nothing so that no environment can make the deploy collide.
    # That would have left no way to open the production build locally, which is
    # the check worth doing before every deploy — it is the same gunicorn, the same
    # headers, the same CSP.
    #
    # So the port lives on a service behind a profile instead of on a variable.
    # A profile cannot be switched on by a stale entry in a deployment panel; it
    # only exists when somebody types `--profile local`, which nothing on the
    # server does.
    #
    #     docker compose --profile local up -d     → http://127.0.0.1:8080
    #
    # Same image as `web`, so it costs a container and no extra build.
    profiles: [local]
    image: caesar-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *logging
    volumes:
      - static:/srv/static:ro
      - media:/srv/media:ro
    ports:
      # Loopback, because a bare `8080:80` publishes an unencrypted app to the
      # internet — and behaves identically in every local test, which is why
      # scripts/check_compose_ports.py checks it rather than a reviewer.
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    networks: [internal, edge]
    # Plain: this one is a local convenience, not the thing being deployed.
    depends_on: [api]
    deploy:
      resources:
        limits: {memory: 128M}

volumes:
  pgdata:
  redisdata:
  static:
  media:
  backups:
  frontend_modules:

networks:
  # Postgres and Redis live here and nothing else can reach them.
  internal:
    internal: true
  # api ↔ web ↔ frontend.
  edge:
  # Dokploy's Traefik network in production; the always-present default bridge
  # locally, so `docker compose up` needs no `docker network create` first.
  #
  # `external` because this compose must not try to own it — Traefik is already
  # attached, and a second definition would create a separate network with the
  # same name and nothing would route.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-bridge}
