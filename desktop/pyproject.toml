[project]
name = "caesar-pos"
version = "0.1.0"
description = "Caesar Cafe — Desktop POS / Kitchen Display client"
requires-python = ">=3.12"

dependencies = [
    "PySide6>=6.8",
    "httpx>=0.27",
    "keyring>=25.4",
    "cryptography>=43.0",
    # Verifies the mirrored PIN hash offline. The server hashes with Argon2id,
    # so without this a cashier cannot log in during an outage — which is the
    # one time it matters most.
    "argon2-cffi>=23.1",
    "python-escpos>=3.1",
    "Pillow>=10.4",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored copies are verified byte-identical to the backend by
# tests/test_vendored_parity.py. Reformatting them here would break that.
extend-exclude = ["src/caesar_pos/vendored/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101",
    "RUF012",
    # Arabic-first UI: Arabic punctuation is flagged against Latin lookalikes.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning"]
