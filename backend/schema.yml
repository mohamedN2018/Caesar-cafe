        id:
          type: string
          format: uuid
          readOnly: true
        guardian:
          type: string
          format: uuid
        first_name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
        age_months_snapshot:
          type: integer
          maximum: 32767
          minimum: 0
        medical_notes:
          type: string
          description: Allergies, conditions staff must know about.
        consent_recorded:
          type: boolean
      required:
      - first_name
      - guardian
      - id
    ChildRequest:
      type: object
      properties:
        guardian:
          type: string
          format: uuid
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        birth_date:
          type: string
          format: date
          nullable: true
        age_months_snapshot:
          type: integer
          maximum: 32767
          minimum: 0
        medical_notes:
          type: string
          description: Allergies, conditions staff must know about.
        consent_recorded:
          type: boolean
      required:
      - first_name
      - guardian
    CloseShiftRequest:
      type: object
      properties:
        counted_cash:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          maxLength: 200
      required:
      - counted_cash
    CostingMethodEnum:
