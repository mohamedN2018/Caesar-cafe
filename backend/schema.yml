openapi: 3.0.3
info:
  title: Caesar Cafe API
  version: 1.0.0
  description: POS, kitchen, inventory and management API for كافيه القيصر.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Change your own password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Web login. Rate-limited per IP and per account (threat D1).
      summary: Log in with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
