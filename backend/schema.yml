components:
  schemas:
    ActivationRequestRequest:
      type: object
      properties:
        license_key:
          type: string
          minLength: 1
          description: QSR-XXXX-XXXX-XXXX-XXXX. Case and dashes are normalized.
        email:
          type: string
          format: email
          minLength: 1
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        mode:
          allOf:
          - $ref: '#/components/schemas/DeviceModeEnum'
          default: POS
        platform:
          type: string
          maxLength: 64
        app_version:
          type: string
          maxLength: 32
        fingerprint:
          type: string
          description: Advisory telemetry. Never used for authorization.
          maxLength: 128
      required:
      - device_name
      - email
      - license_key
    ActivationResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_secret:
          type: string
          description: Returned once. Store in the OS keychain.
        offline_token:
          type: string
          description: Ed25519-signed; verified locally.
        branch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        device_name:
          type: string
        mode:
          type: string
        license_status:
          type: string
        license_expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - branch_id
      - branch_name
      - device_id
      - device_name
      - device_secret
      - license_expires_at
      - license_status
      - mode
      - offline_token
    AdjustmentRequest:
      type: object
      properties:
        item:
          type: string
          format: uuid
        new_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - item
      - new_quantity
      - reason
    ApprovalToken:
      type: object
      properties:
        approval_token:
          type: string
        expires_in:
          type: integer
        permission:
          type: string
        approved_by:
          type: string
      required:
      - approval_token
      - approved_by
      - expires_in
      - permission
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        parent:
          type: string
          format: uuid
          nullable: true
        name_ar:
          type: string
          maxLength: 100
        name_en:
          type: string
          maxLength: 100
        color:
          type: string
          description: '#RRGGBB for the POS grid.'
          maxLength: 9
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        product_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - name_ar
      - product_count
    CategoryRequest:
      type: object
      properties:
        parent:
          type: string
