      required:
      - session
      - warnings
    CheckOutRequest:
      type: object
      properties:
        verified:
          type: boolean
          default: false
          description: The staff member confirmed the recipient's identity. Not a
            formality.
        released_to_guardian:
          type: string
          format: uuid
          nullable: true
        approval_token:
          type: string
          writeOnly: true
          description: Step-up token for kids.release_to_other, from POST /auth/approve.
        bill_to_order:
          type: string
          format: uuid
          nullable: true
          description: Append to this order; omit to open a new one.
