        apps silently produce a wrong schema.
      properties:
        detail:
          type: string
      required:
      - detail
    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        device_name:
          type: string
          readOnly: true
        mode:
          allOf:
          - $ref: '#/components/schemas/DeviceModeEnum'
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/DeviceStatusEnum'
          readOnly: true
        platform:
          type: string
          readOnly: true
        app_version:
          type: string
          readOnly: true
        branch:
          type: string
          format: uuid
          readOnly: true
        branch_name:
          type: string
          readOnly: true
        license:
          type: string
          format: uuid
          readOnly: true
        license_key:
          type: string
          readOnly: true
        first_activated_at:
          type: string
          format: date-time
          readOnly: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_ip:
          type: string
          readOnly: true
          nullable: true
        fingerprint_changed_count:
          type: integer
          readOnly: true
        minutes_since_seen:
          type: number
          format: double
          nullable: true
          readOnly: true
      required:
      - app_version
      - branch
      - branch_name
      - device_name
      - fingerprint_changed_count
      - first_activated_at
      - id
      - last_ip
      - last_seen_at
      - license
      - license_key
      - minutes_since_seen
      - mode
      - platform
      - status
    DeviceModeEnum:
      enum:
      - POS
      - KDS
      - BOTH
      type: string
      description: |-
        * `POS` - POS
        * `KDS` - KDS
        * `BOTH` - BOTH
    DeviceStatus:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        status:
          type: string
        app_version:
          type: string
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        last_push_at:
          type: string
          format: date-time
          nullable: true
        pending:
          type: integer
        rejected:
          type: integer
        open_conflicts:
          type: integer
