openapi: 3.0.3
info:
  title: Caesar Cafe API
  version: 1.0.0
  description: POS, kitchen, inventory and management API for كافيه القيصر.
paths:
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Change your own password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Web login. Rate-limited per IP and per account (threat D1).
      summary: Log in with email and password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Log out
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Profile plus the effective permission set the UI uses to shape
        itself.
      summary: Current principal
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Me'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/mfa/confirm/:
    post:
      operationId: auth_mfa_confirm_create
      summary: Confirm MFA enrolment
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MFAConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MFAConfirmRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/mfa/disable/:
    post:
      operationId: auth_mfa_disable_create
      summary: Disable MFA
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
        '403':
          description: No response body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/mfa/setup/:
    post:
      operationId: auth_mfa_setup_create
      summary: Begin MFA enrolment
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/MFASetup'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Rotate a refresh token. Reuse revokes every session for the account.
      summary: Rotate the refresh token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/sessions/:
    get:
      operationId: auth_sessions_retrieve
      description: Active sessions, so a user can spot a login they do not recognise.
      summary: List your active sessions
      tags:
      - auth
      responses:
        '200':
          description: No response body
    delete:
      operationId: auth_sessions_destroy
      description: Active sessions, so a user can spot a login they do not recognise.
      summary: Revoke all your other sessions
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/set-pin/:
    post:
      operationId: auth_set_pin_create
      description: Setting a POS PIN requires the account password, not just a session.
      summary: Set your POS PIN
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SetPinRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/auth/verify-pin/:
    post:
      operationId: auth_verify_pin_create
      description: |-
        Step-up approval (docs/05).

        A manager enters their PIN to authorize ONE action for the cashier who is
        already logged in. The cashier is never logged out, and both identities are
        recorded against the resulting operation.
      summary: Manager step-up approval
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPinRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyPinRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyPinRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/ApprovalToken'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/activate/:
    post:
      operationId: licensing_activate_create
      description: |-
        The activation handshake. Public by necessity — the device has no
        credentials yet — so it is rate-limited hard (5/hour/IP).
      summary: Activate a device against a licence key
      tags:
      - licensing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivationRequestRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/ActivationResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/device-token/:
    post:
      operationId: licensing_device_token_create
      description: Exchange the long-lived device secret for a short-lived access
        token.
      summary: Obtain a device access token
      tags:
      - licensing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceTokenRequestRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/v1/licensing/devices/:
    get:
      operationId: licensing_devices_list
      summary: List activated devices
      tags:
      - licensing
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/devices/{id}/{action}/:
    post:
      operationId: licensing_devices_create
      description: revoke · reset · suspend · resume
      summary: Act on a device
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - licensing
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Detail'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/heartbeat/:
    post:
      operationId: licensing_heartbeat_create
      description: |-
        Periodic liveness + licence status, and how a fresh offline token reaches
        the device. A terminal that is online daily slides its grace window forward
        without ever noticing the mechanism.
      summary: Device heartbeat
      tags:
      - licensing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeartbeatRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeartbeatRequestRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/HeartbeatResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/invoice-blocks/:
    post:
      operationId: licensing_invoice_blocks_create
      description: Reserve the next disjoint invoice-number range for this device
        (C9).
      summary: Allocate an invoice number block
      tags:
      - licensing
      responses:
        '201':
          description: No response body
  /api/v1/licensing/licenses/:
    get:
      operationId: licensing_licenses_list
      summary: List licences
      tags:
      - licensing
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/License'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
    post:
      operationId: licensing_licenses_create
      summary: Issue a licence
      tags:
      - licensing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueLicenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/IssueLicenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IssueLicenseRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/IssuedLicense'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/licenses/{id}/:
    get:
      operationId: licensing_licenses_retrieve
      summary: Licence detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - licensing
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/License'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/licenses/{id}/{action}/:
    post:
      operationId: licensing_license_action
      description: suspend · resume · revoke · renew · regenerate-key
      summary: Act on a licence (suspend · resume · revoke · renew · regenerate-key)
      parameters:
      - in: path
        name: action
        schema:
          type: string
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - licensing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewLicenseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RenewLicenseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RenewLicenseRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/License'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/licensing/licenses/{id}/events/:
    get:
      operationId: licensing_licenses_events_list
      summary: Licence event log
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - licensing
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LicenseEvent'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - ar
          - en
      tags:
      - schema
      security:
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: {}
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
            application/yaml:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: {}
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
            application/vnd.oai.openapi+json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: {}
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: object
                    additionalProperties: {}
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/settings/:
    get:
      operationId: settings_retrieve
      description: Resolved values for a scope, each tagged with where it came from.
      summary: Resolved settings for a scope
      tags:
      - settings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SettingListResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
    patch:
      operationId: settings_partial_update
      description: Resolved values for a scope, each tagged with where it came from.
      summary: Write setting overrides
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettingWriteRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSettingWriteRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSettingWriteRequestRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SettingWriteResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
        '207':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SettingWriteResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/settings/{key}/:
    delete:
      operationId: settings_destroy
      summary: Reset a setting to its inherited or default value
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - settings
      responses:
        '204':
          description: No response body
  /api/v1/settings/history/:
    get:
      operationId: settings_history_retrieve
      summary: Who changed what, and when
      tags:
      - settings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SettingHistoryResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/settings/schema/:
    get:
      operationId: settings_schema_retrieve
      description: |-
        The registry, as data.

        The Web Admin renders its entire settings UI from this — grouped, typed,
        validated, with Arabic labels and help. A new setting appears in the UI
        with no frontend change.
      summary: Settings registry schema
      tags:
      - settings
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SettingSchemaResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/system/health/:
    get:
      operationId: system_health_retrieve
      description: Reports API liveness and database reachability.
      summary: Health check
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Health'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
        '503':
          description: No response body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/system/info/:
    get:
      operationId: system_info_retrieve
      description: |-
        Version negotiation for Desktop clients (§61).

        A client below `min_supported_client_version` is refused everything except
        the heartbeat — one that predates a breaking sync change must not be allowed
        to corrupt data by guessing at the new contract.
      summary: Server and client version information
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SystemInfo'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
