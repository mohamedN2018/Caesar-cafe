openapi: 3.0.3
info:
  title: Caesar Cafe API
  version: 1.0.0
  description: POS, kitchen, inventory and management API for كافيه القيصر.
paths:
  /api/v1/audit/:
    get:
      operationId: audit_list
      summary: Audit log
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: domain
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - in: query
        name: severity
        schema:
          type: string
          enum:
          - INFO
          - NOTICE
          - WARNING
      - in: query
        name: since
        schema:
          type: string
        description: ISO-8601. Defaults to 30 days ago.
      tags:
      - audit
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/audit/{id}/:
    get:
      operationId: audit_retrieve
      summary: One audit entry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - audit
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/AuditLog'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/audit/actions/:
    get:
      operationId: audit_actions_list
      description: The catalogue, so the UI's filter is generated rather than hardcoded.
      summary: Audited action catalogue
      tags:
