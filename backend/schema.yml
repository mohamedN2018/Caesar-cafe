  /api/v1/catalog/categories/:
    get:
      operationId: catalog_categories_list
      description: |-
        Reads and writes are confined to the caller's branch.

        `branch` and `organization` are injected from the authenticated principal
        and NEVER read from the request body — otherwise any authenticated user
        could write into another tenant by editing a payload (threat I1).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: أي حقل يجب استخدامه عند ترتيب النتائج.
        schema:
          type: string
      - in: query
        name: parent
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: مصطلح البحث.
        schema:
          type: string
      tags:
      - catalog
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
