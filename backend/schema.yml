                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SyncConflict'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/sync/operations/:
    get:
      operationId: sync_operations_list
      description: The push log — what each terminal actually sent, and what became
        of it.
      summary: Pushed operations
      parameters:
      - in: query
        name: device
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - sync
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncOperation'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/sync/pull/:
    get:
      operationId: sync_pull_retrieve
      summary: Pull server changes on one stream
      parameters:
      - in: query
        name: cursor
        schema:
          type: integer
        description: Last seq this device processed.
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: stream
        schema:
          type: string
          enum:
          - catalog
          - config
          - floor
          - kids
          - orders
          - staff
        required: true
      tags:
      - sync
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/PullResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/sync/push/:
    post:
      operationId: sync_push_create
      summary: Push a batch of queued operations
      tags:
      - sync
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PushRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PushRequestRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/PushResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
        '207':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/PushResponse'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/sync/state/:
    get:
      operationId: sync_state_retrieve
      description: |-
        Where this device stands, from the server's point of view.

        A terminal asks this on startup so it can show an honest indicator instead
        of assuming it is up to date because nothing has failed yet.
      summary: This device's sync state
      tags:
      - sync
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/DeviceStatus'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/sync/status/:
    get:
      operationId: sync_status_retrieve
      summary: Sync health for the whole branch
      tags:
      - sync
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/BranchStatus'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
  /api/v1/system/health/:
    get:
      operationId: system_health_retrieve
      description: Reports API liveness and database reachability.
      summary: Health check
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/Health'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
        '503':
          description: No response body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/system/info/:
    get:
      operationId: system_info_retrieve
      description: |-
        Version negotiation for Desktop clients (§61).

        A client below `min_supported_client_version` is refused everything except
        the heartbeat — one that predates a breaking sync change must not be allowed
        to corrupt data by guessing at the new contract.
      summary: Server and client version information
      tags:
      - system
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  data:
                    $ref: '#/components/schemas/SystemInfo'
                  meta:
                    type: object
                    properties:
                      request_id:
                        type: string
                        description: Correlates this response with server logs.
                required:
                - success
                - data
          description: ''
components:
  schemas:
    ActivationRequestRequest:
      type: object
      properties:
        license_key:
          type: string
          minLength: 1
          description: QSR-XXXX-XXXX-XXXX-XXXX. Case and dashes are normalized.
        email:
          type: string
          format: email
          minLength: 1
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        mode:
          allOf:
          - $ref: '#/components/schemas/DeviceModeEnum'
          default: POS
        platform:
          type: string
          maxLength: 64
        app_version:
          type: string
          maxLength: 32
        fingerprint:
          type: string
          description: Advisory telemetry. Never used for authorization.
          maxLength: 128
      required:
      - device_name
      - email
      - license_key
    ActivationResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_secret:
          type: string
          description: Returned once. Store in the OS keychain.
        offline_token:
          type: string
          description: Ed25519-signed; verified locally.
        branch_id:
          type: string
          format: uuid
        branch_name:
          type: string
        device_name:
          type: string
        mode:
          type: string
        license_status:
          type: string
        license_expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - branch_id
      - branch_name
      - device_id
      - device_name
      - device_secret
      - license_expires_at
      - license_status
      - mode
      - offline_token
    AdjustmentRequest:
      type: object
      properties:
        item:
          type: string
          format: uuid
        new_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,11}(?:\.\d{0,3})?$
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - item
      - new_quantity
      - reason
    ApplyResult:
      type: object
      properties:
        applied:
          type: array
          items:
            type: string
        skipped:
          type: array
          items:
            type: string
          description: Already recorded — a replay, not an error.
        order:
          $ref: '#/components/schemas/Order'
      required:
      - applied
      - order
      - skipped
    ApprovalToken:
      type: object
      properties:
        approval_token:
          type: string
        expires_in:
          type: integer
        permission:
          type: string
        approved_by:
          type: string
      required:
      - approval_token
      - approved_by
      - expires_in
      - permission
    Area:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name_ar:
          type: string
          description: الصالة / التراس / صالة الأطفال
          maxLength: 100
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - id
      - name_ar
    AreaRequest:
      type: object
      properties:
        name_ar:
          type: string
          minLength: 1
          description: الصالة / التراس / صالة الأطفال
          maxLength: 100
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - name_ar
    AuditAction:
      type: object
      description: The catalogue, so the UI can build its filter without hardcoding
        codes.
      properties:
        code:
          type: string
        domain:
          type: string
        label_ar:
          type: string
        severity:
          type: string
      required:
      - code
      - domain
      - label_ar
      - severity
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          readOnly: true
        label_ar:
          type: string
          readOnly: true
        domain:
          type: string
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        branch:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        actor_name:
          type: string
          readOnly: true
          description: Snapshotted — a deleted user must still be nameable.
        approved_by_name:
          type: string
          readOnly: true
        device_id:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        object_type:
          type: string
          readOnly: true
        object_id:
          type: string
          readOnly: true
        object_label:
          type: string
          readOnly: true
          description: 'Human-readable, snapshotted: ''MB-01-0042''.'
        before:
          readOnly: true
        after:
          readOnly: true
        changes:
          readOnly: true
          description: 'Only the fields that moved: {field: [old, new]}.'
        detail:
          readOnly: true
          description: Context that is not a field change — a reason, an amount.
        ip_address:
          type: string
          readOnly: true
          nullable: true
        request_id:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - actor
      - actor_name
      - after
      - approved_by_name
      - before
      - branch
      - changes
      - detail
      - device_id
      - domain
      - id
      - ip_address
      - label_ar
      - object_id
      - object_label
      - object_type
      - occurred_at
      - request_id
      - severity
    Board:
      type: object
      properties:
        area_id:
          type: string
          format: uuid
        area_name:
          type: string
        occupancy:
          type: integer
        capacity:
          type: integer
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/PlaySession'
      required:
      - area_id
      - area_name
      - capacity
      - occupancy
      - sessions
    BranchStatus:
      type: object
      properties:
        branch_id:
          type: string
          format: uuid
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceStatus'
        stale_devices:
          type: integer
        offline_alert_minutes:
          type: integer
        open_conflicts:
          type: integer
        heads:
          type: object
          additionalProperties:
            type: integer
      required:
      - branch_id
      - devices
      - heads
      - offline_alert_minutes
      - open_conflicts
      - stale_devices
    CashMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        movement_type:
          $ref: '#/components/schemas/CashMovementTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: Always positive; the type carries direction.
        reason:
          type: string
          maxLength: 200
        user_name:
          type: string
          readOnly: true
        occurred_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - id
      - movement_type
      - occurred_at
      - reason
      - user_name
    CashMovementRequestRequest:
      type: object
      properties:
        movement_type:
          $ref: '#/components/schemas/CashMovementTypeEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        reason:
          type: string
          minLength: 1
          maxLength: 200
      required:
      - amount
      - movement_type
      - reason
    CashMovementTypeEnum:
      enum:
      - IN
      - OUT
      - EXPENSE
      - DROP
      type: string
      description: |-
        * `IN` - IN
        * `OUT` - OUT
        * `EXPENSE` - EXPENSE
        * `DROP` - DROP
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        parent:
          type: string
          format: uuid
          nullable: true
        name_ar:
          type: string
          maxLength: 100
        name_en:
          type: string
          maxLength: 100
        color:
          type: string
          description: '#RRGGBB for the POS grid.'
          maxLength: 9
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
        product_count:
          type: integer
          readOnly: true
          default: 0
      required:
      - id
      - name_ar
      - product_count
    CategoryRequest:
      type: object
      properties:
        parent:
          type: string
          format: uuid
          nullable: true
        name_ar:
          type: string
          minLength: 1
          maxLength: 100
        name_en:
          type: string
          maxLength: 100
        color:
          type: string
          description: '#RRGGBB for the POS grid.'
          maxLength: 9
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_active:
          type: boolean
      required:
      - name_ar
    Change:
      type: object
      properties:
        seq:
          type: integer
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        operation:
          type: string
        payload: {}
      required:
      - entity_id
      - entity_type
      - operation
      - payload
      - seq
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 10
      required:
      - current_password
      - new_password
    ChangeTariffRequest:
      type: object
      properties:
        tariff:
          type: string
          format: uuid
      required:
      - tariff
    CheckInRequest:
      type: object
      description: |-
        Deliberately short. A parent with a restless child will not tolerate a long
        form, and every optional field here is one the staff can fill in later.
      properties:
        area:
          type: string
          format: uuid
        child_name:
          type: string
          minLength: 1
          maxLength: 100
        guardian_name:
          type: string
          minLength: 1
          maxLength: 150
        guardian_phone:
          type: string
          maxLength: 32
        guardian_id:
          type: string
          format: uuid
          nullable: true
        age_months:
          type: integer
          minimum: 0
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        tariff:
          type: string
          format: uuid
          nullable: true
        tag_number:
          type: string
          minLength: 1
          maxLength: 16
        order:
          type: string
          format: uuid
          nullable: true
        session_id:
          type: string
          format: uuid
          nullable: true
          description: Client-minted, so an offline check-in keeps its identity.
        medical_notes:
          type: string
      required:
      - area
      - child_name
      - guardian_name
      - tag_number
    CheckInResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/PlaySession'
        warnings:
          type: array
          items:
            type: string
          description: Non-blocking problems the staff member must see, e.g. an age
