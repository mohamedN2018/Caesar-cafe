      type: object
      description: |-
        One worked example, computed by the authoritative engine.

        The tariff builder shows these so an admin sees what a rule actually costs
        before saving it. Deliberately a server round-trip: a preview calculated in
        the browser would be a second pricing implementation, and a second
        implementation is how the displayed number and the charged number drift.
      properties:
        minutes:
          type: integer
        charge:
          type: string
        billable_minutes:
          type: integer
        blocks:
          type: integer
        capped:
          type: boolean
      required:
      - billable_minutes
      - blocks
      - capped
      - charge
      - minutes
    Ticket:
      type: object
      description: |-
        The kitchen ticket, in ONE shape.

        Deliberately not a ModelSerializer: `services.serialize_ticket` is the
        single source, and both the WebSocket push and this REST fallback emit its
        output verbatim. A KDS that reconnects after a dropped socket must not have
        to parse a different object than the one it was receiving a second earlier —
        two shapes is how a fallback path quietly rots.
      properties:
        id:
          type: string
          format: uuid
        ticket_number:
          type: integer
        status:
          type: string
        order_id:
          type: string
          format: uuid
        order_number:
          type: string
        order_type:
          type: string
        table:
          type: string
          nullable: true
        station_id:
          type: string
          format: uuid
        station_name:
          type: string
        target_minutes:
          type: integer
        created_at:
          type: string
          format: date-time
        elapsed_seconds:
          type: integer
        is_late:
          type: boolean
        lines:
          type: array
          items:
            $ref: '#/components/schemas/TicketLine'
      required:
      - created_at
      - elapsed_seconds
      - id
      - is_late
      - lines
      - order_id
      - order_number
      - order_type
      - station_id
      - station_name
      - status
      - table
      - target_minutes
      - ticket_number
    TicketLine:
      type: object
      description: Documents the shape produced by `services.serialize_ticket`.
      properties:
