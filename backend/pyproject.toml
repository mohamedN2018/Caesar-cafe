[project]
name = "caesar-backend"
version = "0.1.0"
description = "Caesar Cafe — REST API and source of truth"
requires-python = ">=3.12"

dependencies = [
    "Django>=5.1,<5.3",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.3",
    "django-cors-headers>=4.4",
    "drf-spectacular>=0.27",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.2",
    "redis>=5.0",
    "celery>=5.4",
    "django-celery-beat>=2.7",
    "channels[daphne]>=4.1",
    "channels-redis>=4.2",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    # Outbound HTTP: Web Push deliveries. One dependency for a connection pool
    # and timeouts, rather than four to do the encryption `cryptography` already
    # provides — see apps/notifications/webpush.py.
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "Pillow>=10.4",
    "gunicorn>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "freezegun>=1.5",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.0",
    "djangorestframework-stubs>=3.15",
    "ipython>=8.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "apps"]


# ── ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit — security
    "DJ",            # flake8-django
    "RUF",
]
ignore = [
    "S101",   # assert — fine in tests
    "RUF012", # mutable class attrs need ClassVar — noisy with Django
    # This is an Arabic-first codebase: labels, help text and user-facing
    # messages are Arabic. Arabic punctuation (، ؛ ٪) is flagged as "ambiguous"
    # against Latin lookalikes, which is correct in general and wrong here.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106"]      # hardcoded test credentials are fine
"**/settings/*.py" = ["F403", "F405"] # star-imports across settings modules


# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"


# ── pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_test.py"]
# `--ds` outranks the DJANGO_SETTINGS_MODULE environment variable, which the
# dev container sets to config.settings.dev. Without it the suite silently runs
# against dev settings — real throttle rates, Redis cache, DEBUG=True — and
# tests pass or fail for reasons unrelated to the code under test.
addopts = "-ra --strict-markers --ds=config.settings.test"
# Channels consumers are async; the socket tests declare asyncio_mode explicitly
# rather than relying on a marker on every test.
asyncio_mode = "auto"
testpaths = ["tests", "apps"]
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
