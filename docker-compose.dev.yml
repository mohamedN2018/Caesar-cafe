## Caesar Cafe — development stack
##   docker compose -f docker-compose.dev.yml up -d
##
## Postgres and Redis are on an internal network with no published ports, matching
## production. Use `make shell-db` rather than connecting a client to localhost —
## if it works in dev only because a port is exposed, it will fail in production.

name: caesar-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-caesar}
      POSTGRES_USER: ${POSTGRES_USER:-caesar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caesar_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caesar} -d ${POSTGRES_DB:-caesar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      target: dev
    command: python manage.py runserver 0.0.0.0:8000
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
    ports:
      # Host port is configurable — this machine runs several Django stacks and
      # 8000 is commonly taken. Container port stays 8000.
      - "${API_PORT:-8000}:8000"
    networks: [internal, edge]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: ./backend
      target: dev
    command: celery -A config worker -l info --concurrency=2
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
    networks: [internal]
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  beat:
    build:
      context: ./backend
      target: dev
    command: celery -A config beat -l info
    env_file: [.env]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes:
      - ./backend:/app
    networks: [internal]
    depends_on:
      redis: {condition: service_healthy}

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    env_file: [.env]
    environment:
      # Derived from API_PORT rather than set separately in .env. Two hardcoded
      # copies of the same port is a trap: change one and the browser silently
      # calls a port nothing is listening on.
      VITE_API_BASE_URL: http://localhost:${API_PORT:-8000}/api/v1
    volumes:
      - ./frontend:/app
      # `npm run api:types` reads ../backend/schema.yml. In CI the whole repo is
      # checked out so the relative path just works; in dev the container needs
      # this mount. Read-only: the schema is generated by the backend, never here.
      - ./backend/schema.yml:/backend/schema.yml:ro
      - frontend_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks: [edge]

volumes:
  pgdata:
  redisdata:
  frontend_modules:

networks:
  internal:
    internal: true
  edge:
