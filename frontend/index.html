<!doctype html>
<!-- RTL-first: the direction is set here, not patched on at runtime. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` so a standalone install reaches under the notch
         rather than sitting in a letterbox. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>القيصر — نظام الإدارة</title>

    <!-- Installable (C11): the owner adds this to a home screen and watches the
         cafe from it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      The real logo, cropped to the emblem. These were hand-drawn SVGs of a
      laurel and a cup — a stand-in from before there was artwork — and the
      192 was broken besides: a 512 viewBox with a 192 background rect, so the
      burgundy filled the top-left quadrant and the rest of the mark sat on
      transparency. Two sizes because 32px in a tab and 512px on a home screen
      want different amounts of detail, not the same file scaled.
    -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icons/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#7b1e28" />

    <!-- Safari still reads these rather than the manifest for the home-screen
         title and status bar. Without them an iOS install is called
         "index.html". -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="القيصر" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
