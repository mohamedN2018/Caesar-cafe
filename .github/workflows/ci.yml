name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: caesar_test
          POSTGRES_USER: caesar
          POSTGRES_PASSWORD: caesar
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
        ports: ['6379:6379']

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgresql://caesar:caesar@localhost:5432/caesar_test
      REDIS_URL: redis://localhost:6379/0

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy apps config

      - name: Migrations are complete
        # A model change without a migration breaks deploys, not development —
        # so it has to fail here.
        run: python manage.py makemigrations --check --dry-run

      - name: Test
        run: pytest --cov=apps --cov-report=term-missing --cov-report=xml

      - name: OpenAPI schema is valid and up to date
        run: |
          python manage.py spectacular --file schema.generated.yml --fail-on-warn
          diff -u schema.yml schema.generated.yml || {
            echo "::error::schema.yml is stale — run 'make schema' and commit the result."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      # These were written in the same batch as the floor geometry and then
      # never ran here — the job type-checked and built, which passes whether or
      # not the geometry agrees with the Desktop's copy of it.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop

    env:
      # Widget tests run headless via Qt's offscreen platform plugin.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/pyproject.toml

      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libgl1 libegl1 libdbus-1-3 libxkbcommon0 \
            libfontconfig1 libfreetype6 libx11-6 libxext6 libxrender1 libxcb1

      - name: Install
        run: pip install -e ".[dev]"

      - name: Vendored modules are in sync with the backend
        working-directory: .
        # Shared logic is copied, not reimplemented. A backend edit that was
        # never vendored means the client and server would disagree about a
        # number — fail here rather than in a cafe.
        run: python scripts/vendor_shared.py --check

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No secrets committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is tracked — it must never be committed."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip install -e .
          pip-audit --strict || echo "::warning::pip-audit reported findings"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Frontend dependency audit
        working-directory: frontend
        # A warning, not a failure. A transitive advisory in a build-only
        # dependency should not stop a deploy that fixes a cashier's bug — but
        # nobody should be able to say they did not know.
        run: npm audit --audit-level=high || echo "::warning::npm audit reported findings"

      - name: Production compose is valid
        # Catches the class of error that otherwise surfaces during a deploy at
        # 6am: a typo in docker-compose.prod.yml or a variable nothing sets.
        env:
          DOMAIN: ci.example
          ACME_EMAIL: ci@example
          POSTGRES_DB: caesar
          POSTGRES_USER: caesar
          POSTGRES_PASSWORD: ci
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Caddyfile is valid
        run: |
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -e DOMAIN=ci.example -e ACME_EMAIL=ci@example \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
